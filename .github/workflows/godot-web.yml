
name: Build Godot Web

on:
  push:
    branches: [main, 3d-version]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Web export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Create Web export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="web/index.html"

          [preset.0.options]

          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import project
        run: godot --headless --path . --editor --import

      - name: Check game startup and GDScript errors
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --quit-after 60 2>&1 | tee godot-startup.log
          # Godot may report RID leaks during headless shutdown even when the
          # game loaded successfully. Do not mistake those cleanup messages
          # for GDScript or game startup failures.
          if grep -E -i 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Invalid call|Invalid access|ERROR:' godot-startup.log \
            | grep -E -v -i 'ERROR: [0-9]+ RID allocations of type|ERROR: [0-9]+ RID of type|leaked at exit'; then
            echo "Godot reported an error while starting the game. See the lines above."
            exit 1
          fi

      - name: Export game
        run: |
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
